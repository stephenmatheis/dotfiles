unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Pass modifier+key combos (e.g. Shift+Enter) through to apps like Claude Code
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Status bar: hax0r fg on the terminal background
set -g status-style "bg=default,fg=#16b10e"

# Status left: session name in dim_green, turning white while the prefix is active.
# Dim text is dim_green, not ghostty_black #334843, which read at 2.01:1 (Claude Code dropped it too)
set -g status-left "#{?client_prefix,#[fg=#fafafa],#[fg=#0b8700]}#[bold]#S #[nobold,fg=default]"
set -g status-left-length 30

# Status right: git branch in dim_green, like Starship's
set -g status-right "#[fg=#0b8700] #(git -C #{pane_current_path} branch --show-current 2>/dev/null || echo '—')"
set -g status-right-length 50

# Window list: current window in bright_green, the rest in dim_green
set -g window-status-format "#[fg=#0b8700]#I #W"
set -g window-status-current-format "#[fg=#19e20e,bold]#I #W"
set -g window-status-separator " "

# Pane borders: the faint outline nvim and VS Code draw (fg @ 15% over bg), and dim_green for the
# active pane like VS Code's focus border; not bright_green, which made splits shout
set -g pane-border-style "fg=#052703"
set -g pane-active-border-style "fg=#0b8700"

set -g status-interval 2
set-hook -g pane-focus-in "refresh-client -S"
set -g mode-keys vi

bind r source-file ~/.config/tmux/tmux.conf
bind x kill-pane

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind c new-window -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
