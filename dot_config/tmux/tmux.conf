unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Pass modifier+key combos (e.g. Shift+Enter) through to apps like Claude Code
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Colors: the hax0r theme's file sets the @hax0r_* colors the formats below use, and the styles
# that can't use them: the status bar in fg on the terminal background, pane borders in the faint
# outline nvim and VS Code draw (fg @ 15% over bg), and the active pane in dim like VS Code's focus
# border; not bright, which made splits shout. `hax0r <theme>` writes the file included second;
# until it's run, Gr33N
source-file ~/.config/tmux/themes/hax0r-green.conf
source-file -q ~/.local/state/hax0r/tmux.conf

# Status left: session name in dim, turning white while the prefix is active.
# Dim text is dim, not ghostty's ansi 8 (#334843 in Gr33N), which read at 2.01:1 (Claude Code dropped it too)
set -g status-left "#{?client_prefix,#[fg=#{@hax0r_white}],#[fg=#{@hax0r_dim}]}#[bold]#S #[nobold,fg=default]"
set -g status-left-length 30

# Status right: git branch in dim, like Starship's
set -g status-right "#[fg=#{@hax0r_dim}] #(git -C #{pane_current_path} branch --show-current 2>/dev/null || echo '—')"
set -g status-right-length 50

# Window list: current window in bright, the rest in dim
set -g window-status-format "#[fg=#{@hax0r_dim}]#I #W"
set -g window-status-current-format "#[fg=#{@hax0r_bright},bold]#I #W"
set -g window-status-separator " "

set -g status-interval 2
set-hook -g pane-focus-in "refresh-client -S"
set -g mode-keys vi

bind r source-file ~/.config/tmux/tmux.conf
bind x kill-pane

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind c new-window -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
