unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Main Status Bar Background/Foreground
set -g status-style "bg=default,fg=#16b10e" # Default status text to Overlay 1

# Status Left: Dim Session Name (#S), turning Peach when prefix is active
set -g status-left "#{?client_prefix,#[fg=#fafafa],#[fg=#334843]}#[bold]#S #[nobold,fg=default]"
set -g status-left-length 30

# Status Right: Git branch in Surface 2 text color
set -g status-right "#[fg=#334843] #(git -C #{pane_current_path} branch --show-current 2>/dev/null || echo '—')"
set -g status-right-length 50

# Window Status Formats (Current is bright Text, inactive is dim Surface 2)
set -g window-status-format "#[fg=#334843]#I #W"
set -g window-status-current-format "#[fg=#19e20e,bold]#I #W"
set -g window-status-separator " "

# Pane Borders (Using Lavender for active, Surface 1 for inactive)
set -g pane-border-style "fg=#334843"
set -g pane-active-border-style "fg=#19e20e"

set -g status-interval 2
set-hook -g pane-focus-in "refresh-client -S"
set -g mode-keys vi

bind r source-file ~/.config/tmux/tmux.conf
bind x kill-pane

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind c new-window -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

