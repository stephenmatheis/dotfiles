# hax0r pink-cyan for tmux: Pink + cyan.
# Built by `hax0r build` from ~/.config/hax0r/palettes.lua: edit that, not this file.
set -g @hax0r_fg '#fd5ca7'
set -g @hax0r_dim '#de0084'
set -g @hax0r_bright '#feaaca'
set -g @hax0r_white '#fafafa'
set -g status-style 'bg=default,fg=#fd5ca7'
set -g pane-border-style 'fg=#3c1024'
set -g pane-active-border-style 'fg=#de0084'
