# hax0r black for tmux: Black on white.
# Built by `hax0r build` from ~/.config/hax0r/palettes.lua: edit that, not this file.
set -g @hax0r_fg '#333333'
set -g @hax0r_dim '#565656'
set -g @hax0r_bright '#000000'
set -g @hax0r_white '#000000'
set -g status-style 'bg=default,fg=#333333'
set -g pane-border-style 'fg=#e0e0e0'
set -g pane-active-border-style 'fg=#565656'
