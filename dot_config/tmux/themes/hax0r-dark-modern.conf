# hax0r dark-modern for tmux: Dark Modern.
# Built by `hax0r build` from ~/.config/hax0r/palettes.lua: edit that, not this file.
set -g @hax0r_fg '#cccccc'
set -g @hax0r_dim '#9d9d9d'
set -g @hax0r_bright '#ffffff'
set -g @hax0r_white '#ffffff'
set -g status-style 'bg=default,fg=#cccccc'
set -g pane-border-style 'fg=#2b2b2b'
set -g pane-active-border-style 'fg=#9d9d9d'
