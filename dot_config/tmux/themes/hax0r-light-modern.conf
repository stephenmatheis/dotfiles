# hax0r light-modern for tmux: Light Modern.
# Built by `hax0r build` from ~/.config/hax0r/palettes.lua: edit that, not this file.
set -g @hax0r_fg '#3b3b3b'
set -g @hax0r_dim '#616161'
set -g @hax0r_bright '#1f1f1f'
set -g @hax0r_white '#000000'
set -g status-style 'bg=default,fg=#3b3b3b'
set -g pane-border-style 'fg=#e5e5e5'
set -g pane-active-border-style 'fg=#616161'
