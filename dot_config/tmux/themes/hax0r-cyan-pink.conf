# hax0r cyan-pink for tmux: Cyan + pink.
# Built by `hax0r build` from ~/.config/hax0r/palettes.lua: edit that, not this file.
set -g @hax0r_fg '#11aaaa'
set -g @hax0r_dim '#008281'
set -g @hax0r_bright '#11d9d9'
set -g @hax0r_white '#fafafa'
set -g status-style 'bg=default,fg=#11aaaa'
set -g pane-border-style 'fg=#032525'
set -g pane-active-border-style 'fg=#008281'
