# hax0r white for tmux: White on black.
# Built by `hax0r build` from ~/.config/hax0r/palettes.lua: edit that, not this file.
set -g @hax0r_fg '#c8c8c8'
set -g @hax0r_dim '#999999'
set -g @hax0r_bright '#ffffff'
set -g @hax0r_white '#fafafa'
set -g status-style 'bg=default,fg=#c8c8c8'
set -g pane-border-style 'fg=#1e1e1e'
set -g pane-active-border-style 'fg=#999999'
